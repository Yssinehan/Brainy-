[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "BRAINY"
version = "1.0.0"
description = "Local-first personal memory + RAG engine - the reusable brain for future projects."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yassine Hannaoui" }]
license = { text = "MIT" }

[project.scripts]
BRAINY = "brainy.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brainy.prompts" = ["*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

